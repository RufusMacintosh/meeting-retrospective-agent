<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>会议复盘智能体 · 项目看板</title>
<style>
:root{
  --bg:#f4f6fb;--surface:#fff;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;
  --primary:#4f46e5;--primary-soft:#eef2ff;
  --mod-user:#8b5cf6;--mod-product:#2563eb;--mod-marketing:#ec4899;--mod-sales:#f59e0b;
  --s-done:#10b981;--s-blocked:#ef4444;--s-progress:#3b82f6;--s-open:#94a3b8;--s-cancelled:#64748b;
  --warn:#f59e0b;--danger:#ef4444;--ok:#10b981;
  --shadow:0 1px 3px rgba(16,24,40,.08),0 8px 24px rgba(16,24,40,.05);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
a{color:var(--primary);text-decoration:none}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* ---------- Header ---------- */
header{background:linear-gradient(120deg,#312e81,#4f46e5 55%,#7c3aed);color:#fff;padding:26px 34px 22px}
header h1{margin:0;font-size:23px;letter-spacing:.5px}
header .sub{opacity:.82;margin-top:6px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px;margin-top:20px}
.stat{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:12px 14px;backdrop-filter:blur(4px)}
.stat .v{font-size:23px;font-weight:700;line-height:1.1}
.stat .k{font-size:12px;opacity:.82;margin-top:4px}

/* ---------- Tabs ---------- */
nav{display:flex;gap:4px;padding:0 34px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
nav button{border:0;background:transparent;padding:15px 20px;color:var(--muted);font-size:14px;font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
nav button.active{color:var(--primary);border-bottom-color:var(--primary)}
main{padding:24px 34px 80px}
.view{display:none}.view.active{display:block}

/* ---------- Board ---------- */
.module{margin-bottom:30px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--border)}
.module-head{padding:15px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
.module-bar{width:5px;height:26px;border-radius:3px}
.module-head h2{margin:0;font-size:17px}
.module-head .cnt{margin-left:auto;color:var(--muted);font-size:12px}
.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.col{padding:14px;border-right:1px solid var(--border);min-height:120px}
.col:last-child{border-right:0}
.col-title{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:1px;margin-bottom:12px;display:flex;justify-content:space-between}
.col-title .n{background:#f1f5f9;border-radius:10px;padding:1px 8px;color:var(--muted)}
.card{border:1px solid var(--border);border-radius:10px;padding:11px 12px;margin-bottom:10px;background:#fff;cursor:pointer;transition:.15s;border-left:3px solid var(--s-open)}
.card:hover{box-shadow:var(--shadow);transform:translateY(-1px);border-color:#c7d2fe}
.card .t{font-weight:600;font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.badge.done{background:#d1fae5;color:#047857}.badge.blocked{background:#fee2e2;color:#b91c1c}
.badge.in_progress{background:#dbeafe;color:#1d4ed8}.badge.open{background:#f1f5f9;color:#475569}
.badge.cancelled{background:#e2e8f0;color:#475569;text-decoration:line-through}
.chip{font-size:11px;padding:2px 7px;border-radius:8px;background:#f8fafc;color:var(--muted);border:1px solid var(--border)}
.chip.warn{background:#fffbeb;color:#b45309;border-color:#fde68a}
.chip.danger{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
.chip.ok{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
.card .bar{height:3px;border-radius:2px;background:#eef2f7;margin-top:9px;overflow:hidden}
.card .bar i{display:block;height:100%;background:var(--primary)}
.empty{color:#9ca3af;font-size:12px;text-align:center;padding:18px 6px;border:1px dashed var(--border);border-radius:9px}

/* ---------- Quality ---------- */
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}
.qcard{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.qcard h3{margin:0 0 3px;font-size:15px}
.qcard .date{color:var(--muted);font-size:12px;margin-bottom:14px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.metric{background:#f8fafc;border-radius:9px;padding:9px 10px}
.metric .v{font-size:17px;font-weight:700}.metric .k{font-size:11px;color:var(--muted)}
.metric .v.good{color:var(--ok)}.metric .v.bad{color:var(--danger)}.metric .v.mid{color:var(--warn)}
.meter{height:6px;background:#eef2f7;border-radius:4px;overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;border-radius:4px}
.issue{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:9px 11px;margin-top:8px;font-size:12.5px}
.issue b{color:#92400e}
.issue .ev{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
.evbtn{border:1px solid #fcd34d;background:#fff;border-radius:6px;padding:2px 7px;font-size:11px;color:#92400e}
.evbtn:hover{background:#fef3c7}
.spk{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:12px}
.spk .nm{width:42px;color:var(--muted)}
.spk .track{flex:1;height:8px;background:#eef2f7;border-radius:4px;overflow:hidden}
.spk .track i{display:block;height:100%;background:var(--primary)}
.spk .pc{width:38px;text-align:right;color:var(--muted)}

/* ---------- History query ---------- */
.searchbar{display:flex;gap:10px;margin-bottom:18px}
.searchbar input{flex:1;max-width:560px;border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-size:14px;outline:none}
.searchbar input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.searchbar button{border:0;background:var(--primary);color:#fff;border-radius:10px;padding:0 22px;font-weight:600}
.hint{color:var(--muted);font-size:12px;margin-bottom:16px}
.hitem{background:#fff;border:1px solid var(--border);border-radius:10px;padding:13px 16px;margin-bottom:9px;cursor:pointer;display:flex;align-items:center;gap:12px}
.hitem:hover{border-color:#c7d2fe;box-shadow:var(--shadow)}
.hitem .id{font-size:12px;color:var(--primary);font-weight:700;min-width:62px}

/* ---------- Drawer ---------- */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.4);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.mask.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(600px,94vw);background:#fff;box-shadow:-12px 0 40px rgba(15,23,42,.15);transform:translateX(100%);transition:.25s;z-index:50;display:flex;flex-direction:column}
.drawer.show{transform:translateX(0)}
.dhead{padding:20px 22px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px}
.dhead h2{margin:0;font-size:17px;flex:1;line-height:1.4}
.dhead .x{border:0;background:#f1f5f9;width:30px;height:30px;border-radius:8px;font-size:18px;color:var(--muted)}
.dbody{padding:0 22px 30px;overflow-y:auto;flex:1}
.dtabs{display:flex;gap:2px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:2}
.dtabs button{border:0;background:transparent;padding:12px 14px;color:var(--muted);font-weight:600;font-size:13px;border-bottom:2px solid transparent}
.dtabs button.active{color:var(--primary);border-bottom-color:var(--primary)}
.dpanel{display:none;padding-top:16px}.dpanel.active{display:block}
.kv{display:grid;grid-template-columns:88px 1fr;gap:7px 12px;font-size:13px;margin-bottom:16px}
.kv .k{color:var(--muted)}
.desc{background:#f8fafc;border-radius:9px;padding:11px 13px;font-size:13px;color:#334155;margin-bottom:16px;white-space:pre-wrap}
.evcard{border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:10px}
.evcard .top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.evcard .top .sid{font-weight:700;color:var(--primary)}
.evcard .quote{background:#f8fafc;border-left:3px solid var(--primary);padding:8px 11px;border-radius:0 7px 7px 0;font-size:13px;white-space:pre-wrap}
.evcard .loc{margin-top:7px;font-size:11.5px}
.linkbtn{border:0;background:var(--primary-soft);color:var(--primary);border-radius:6px;padding:3px 9px;font-size:11.5px;font-weight:600}
.tl{position:relative;padding-left:20px}
.tl:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tlitem{position:relative;margin-bottom:14px}
.tlitem:before{content:"";position:absolute;left:-18px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 2px var(--primary-soft)}
.tlitem .h{font-size:12.5px;font-weight:600}
.tlitem .h .ver{color:var(--primary)}
.tlitem .note{font-size:12px;color:var(--muted);margin-top:2px}
.tlitem .diff{font-size:11.5px;background:#f8fafc;border-radius:7px;padding:7px 9px;margin-top:6px}
.tlitem .diff div{margin:2px 0}.old{color:#b91c1c}.new{color:#047857}
.alert{border-radius:9px;padding:10px 12px;margin-bottom:10px;font-size:12.5px}
.alert.conf{background:#fff7ed;border:1px solid #fed7aa}
.alert.miss{background:#f8fafc;border:1px solid var(--border)}
.alert .t{font-weight:700;margin-bottom:5px}

/* ---------- Source modal ---------- */
.src{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.5);padding:20px}
.src.show{display:flex}
.srcbox{background:#fff;border-radius:14px;width:min(820px,96vw);max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.srcbox .h{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.srcbox .h h3{margin:0;font-size:15px;flex:1}
.srcbox .b{overflow-y:auto;padding:16px 20px}
.seg{padding:10px 12px;border-radius:8px;margin-bottom:7px;border:1px solid var(--border)}
.seg.target{border-color:var(--primary);background:var(--primary-soft)}
.seg .m{font-size:11.5px;color:var(--muted);margin-bottom:4px;display:flex;gap:10px}
.seg .txt{font-size:13px;white-space:pre-wrap}
</style>
</head>
<body>
<header>
  <h1>会议复盘智能体 · 项目看板</h1>
  <div class="sub" id="subtitle"></div>
  <div class="stats" id="stats"></div>
</header>
<nav>
  <button class="active" data-v="board">四模块复盘看板</button>
  <button data-v="quality">会议组织与发言规范</button>
  <button data-v="history">单一事项历史查询</button>
</nav>
<main>
  <section class="view active" id="v-board"></section>
  <section class="view" id="v-quality"></section>
  <section class="view" id="v-history">
    <div class="searchbar">
      <input id="q" placeholder="输入事项 ID（如 M-0011）或标题关键词" />
      <button onclick="doSearch()">查询</button>
    </div>
    <div class="hint">支持按 matter_id 精确查询，或按标题/描述模糊匹配；点击结果查看完整版本历史与证据链。</div>
    <div id="searchResult"></div>
  </section>
</main>

<div class="mask" id="mask" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer">
  <div class="dhead"><h2 id="dtitle"></h2><button class="x" onclick="closeDrawer()">×</button></div>
  <div class="dbody">
    <div class="dtabs">
      <button class="active" data-t="info" onclick="switchTab('info')">事项信息</button>
      <button data-t="ev" onclick="switchTab('ev')">证据链</button>
      <button data-t="his" onclick="switchTab('his')">版本历史</button>
      <button data-t="flag" onclick="switchTab('flag')">冲突与缺失</button>
    </div>
    <div class="dpanel active" id="p-info"></div>
    <div class="dpanel" id="p-ev"></div>
    <div class="dpanel" id="p-his"></div>
    <div class="dpanel" id="p-flag"></div>
  </div>
</aside>

<div class="src" id="srcModal">
  <div class="srcbox">
    <div class="h"><h3 id="srcTitle">原文核验</h3><button class="x" style="border:0;background:#f1f5f9;border-radius:8px;width:30px;height:30px" onclick="closeSrc()">×</button></div>
    <div class="b" id="srcBody"></div>
  </div>
</div>

<script>
const BOARD = /*__BOARD_DATA__*/;
const HISTORIES = /*__HISTORIES_DATA__*/;
const TRANSCRIPTS = /*__TRANSCRIPTS_DATA__*/;

const MODCOLOR={user_insights:'var(--mod-user)',product_dev:'var(--mod-product)',marketing:'var(--mod-marketing)',sales_conversion:'var(--mod-sales)'};
const MODNAME={user_insights:'用户洞察',product_dev:'产品开发',marketing:'市场营销',sales_conversion:'销售转化'};
const CATNAME={progress:'进度',blocker:'卡点',action:'行动',feedback:'反馈'};
const STATNAME={open:'待办',in_progress:'进行中',done:'已完成',blocked:'被阻塞',cancelled:'已取消'};
const CHGNAME={created:'创建',updated:'信息更新',status_changed:'状态变更',merged:'跨会议合并',confirmed:'已确认'};
let currentMatter=null;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function badges(m){
  let h='<span class="badge '+esc(m.status)+'">'+STATNAME[m.status]+'</span>';
  if(m.owner)h+='<span class="chip">👤 '+esc(m.owner)+'</span>';
  if(m.due_date)h+='<span class="chip">⏰ '+esc(m.due_date)+'</span>';
  if(m.conflicts&&m.conflicts.length)h+='<span class="chip danger">冲突 '+m.conflicts.length+'</span>';
  if(m.missing_fields&&m.missing_fields.length)h+='<span class="chip warn">缺失 '+m.missing_fields.length+'</span>';
  if(m.merged_from&&m.merged_from.length>1)h+='<span class="chip ok">合并 ×'+m.merged_from.length+'</span>';
  return h;
}
function renderStats(){
  document.getElementById('subtitle').textContent='项目 '+BOARD.project_id+' · 数据生成于 '+new Date(BOARD.generated_at).toLocaleString('zh-CN')+' · 共 '+BOARD.meetings.length+' 场会议';
  const s=BOARD.stats;
  const items=[
    ['事项总数',s.matter_count],['已闭环率',(s.closed_rate*100).toFixed(0)+'%'],
    ['证据引用',s.evidence_count],['跨会议合并',s.merge_count||0],
    ['信息冲突',s.conflict_count],['缺失标注',s.missing_field_count],['规范问题',s.quality_issue_count]
  ];
  document.getElementById('stats').innerHTML=items.map(x=>'<div class="stat"><div class="v">'+esc(x[1])+'</div><div class="k">'+esc(x[0])+'</div></div>').join('');
}
function renderBoard(){
  const mods=['user_insights','product_dev','marketing','sales_conversion'];
  const cats=['progress','blocker','action','feedback'];
  let html='';
  mods.forEach(mod=>{
    const cols=BOARD.columns.filter(c=>c.module===mod);
    const total=cols.reduce((a,c)=>a+c.items.length,0);
    html+='<div class="module"><div class="module-head"><div class="module-bar" style="background:'+MODCOLOR[mod]+'"></div><h2>'+MODNAME[mod]+'</h2><span class="cnt">'+total+' 项</span></div><div class="cols">';
    cats.forEach(cat=>{
      const col=cols.find(c=>c.category===cat);
      const list=col?col.items:[];
      html+='<div class="col"><div class="col-title"><span>'+CATNAME[cat]+'</span><span class="n">'+list.length+'</span></div>';
      if(!list.length)html+='<div class="empty">暂无事项</div>';
      list.forEach(m=>{
        html+='<div class="card" style="border-left-color:var(--s-'+m.status+')" onclick="openDrawer(\''+m.matter_id+'\')">'
          +'<div class="t">'+esc(m.title)+'</div><div class="meta">'+badges(m)+'</div>'
          +'<div class="bar"><i style="width:'+Math.round(m.confidence*100)+'%"></i></div></div>';
      });
      html+='</div>';
    });
    html+='</div></div>';
  });
  document.getElementById('v-board').innerHTML=html;
}
function rate(v){return v>=.8?'good':(v>=.5?'mid':'bad');}
function renderQuality(){
  let html='<div class="qgrid">';
  BOARD.meetings.forEach(q=>{
    const dc=q.decision_clarity||{};
    html+='<div class="qcard"><h3>'+esc(q.meeting_title)+'</h3><div class="date mono">'+esc(q.meeting_id)+' · '+esc(q.date)+'</div>';
    html+='<div class="metrics">'
      +'<div class="metric"><div class="v '+rate(q.agenda_coverage)+'">'+(q.agenda_coverage*100).toFixed(0)+'%</div><div class="k">议程覆盖</div><div class="meter"><i style="width:'+(q.agenda_coverage*100)+'%;background:var(--primary)"></i></div></div>'
      +'<div class="metric"><div class="v '+rate(q.speaker_balance)+'">'+(q.speaker_balance*100).toFixed(0)+'%</div><div class="k">发言均衡</div><div class="meter"><i style="width:'+(q.speaker_balance*100)+'%;background:var(--mod-user)"></i></div></div>'
      +'<div class="metric"><div class="v '+rate(dc.clarity_score||0)+'">'+((dc.clarity_score||0)*100).toFixed(0)+'%</div><div class="k">结论明确度</div><div class="meter"><i style="width:'+((dc.clarity_score||0)*100)+'%;background:var(--mod-sales)"></i></div></div>'
      +'</div>';
    html+='<div class="metrics" style="grid-template-columns:repeat(3,1fr)">'
      +'<div class="metric"><div class="v">'+q.off_topic.length+'</div><div class="k">跑题片段</div></div>'
      +'<div class="metric"><div class="v">'+q.interruptions.length+'</div><div class="k">打断次数</div></div>'
      +'<div class="metric"><div class="v">'+q.open_item_count+'</div><div class="k">未闭环事项</div></div></div>';
    html+='<div style="font-size:12px;color:var(--muted);margin-bottom:5px">发言人参与度</div>';
    (q.speaker_stats||[]).forEach(s=>{
      html+='<div class="spk"><span class="nm">'+esc(s.speaker)+'</span><span class="track"><i style="width:'+(s.share*100)+'%"></i></span><span class="pc">'+(s.share*100).toFixed(0)+'%</span></div>';
    });
    html+='<div style="font-size:12px;color:var(--muted);margin:14px 0 4px">规范问题（可点击查看原文证据）</div>';
    (q.issues||[]).forEach((iss,i)=>{
      const key='issue-'+String(i+1).padStart(2,'0');
      const segs=(q.evidence_index||{})[key]||[];
      html+='<div class="issue"><b>'+esc(iss)+'</b>';
      if(segs.length){
        html+='<div class="ev">';
        segs.slice(0,8).forEach(sid=>html+='<button class="evbtn" onclick="showSource(\''+q.meeting_id+'\',\''+sid+'\')">'+esc(sid)+'</button>');
        html+='</div>';
      }
      html+='</div>';
    });
    html+='</div>';
  });
  html+='</div>';
  document.getElementById('v-quality').innerHTML=html;
}
function doSearch(){
  const kw=document.getElementById('q').value.trim().toLowerCase();
  let list=[];
  Object.values(BOARD.columns).forEach(c=>c.items.forEach(m=>list.push(m)));
  if(!kw){document.getElementById('searchResult').innerHTML='<div class="hint">请输入关键词后查询。</div>';return;}
  list=list.filter(m=>(m.matter_id+' '+m.title+' '+m.description).toLowerCase().includes(kw));
  if(!list.length){document.getElementById('searchResult').innerHTML='<div class="hint">未找到匹配事项。</div>';return;}
  document.getElementById('searchResult').innerHTML=list.map(m=>'<div class="hitem" onclick="openDrawer(\''+m.matter_id+'\')"><span class="id mono">'+m.matter_id+'</span><span style="flex:1">'+esc(m.title)+'</span>'+badges(m)+'</div>').join('');
}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');document.getElementById('v-'+b.dataset.v).classList.add('active');
});

function findMatter(id){
  for(const c of BOARD.columns){const m=c.items.find(x=>x.matter_id===id);if(m)return m;}
  return null;
}
function openDrawer(id){
  const m=findMatter(id);if(!m)return;
  currentMatter=m;
  document.getElementById('dtitle').textContent=m.matter_id+' · '+m.title;
  const h=HISTORIES[id]||[];
  document.getElementById('p-info').innerHTML='<div class="kv">'
    +'<div class="k">事项 ID</div><div class="mono">'+esc(m.matter_id)+'</div>'
    +'<div class="k">模块 / 分类</div><div>'+MODNAME[m.module]+' / '+CATNAME[m.category]+'</div>'
    +'<div class="k">状态</div><div><span class="badge '+m.status+'">'+STATNAME[m.status]+'</span></div>'
    +'<div class="k">责任人</div><div>'+(m.owner?esc(m.owner):'<span style="color:var(--danger)">未明确（已标注缺失）</span>')+'</div>'
    +'<div class="k">截止时间</div><div>'+(m.due_date?esc(m.due_date)+' <span style="color:var(--muted);font-size:11px">（原文相对表述，未推断绝对日期）</span>':'<span style="color:var(--danger)">未明确（已标注缺失）</span>')+'</div>'
    +'<div class="k">优先级</div><div>'+esc(m.priority)+'</div>'
    +'<div class="k">置信度</div><div>'+(m.confidence*100).toFixed(0)+'%</div>'
    +'<div class="k">版本数</div><div>'+h.length+' 版（最近更新 '+(h.length?h[h.length-1].meeting_date:'—')+'）</div>'
    +'<div class="k">首次发现</div><div>'+esc(m.first_seen_meeting)+' · '+esc(m.first_seen_date)+'</div>'
    +'<div class="k">合并来源</div><div class="mono" style="font-size:11.5px">'+esc((m.merged_from||[]).join(', '))+'</div>'
    +'</div><div class="desc">'+esc(m.description)+'</div>';
  document.getElementById('p-ev').innerHTML=(m.evidence||[]).map(e=>'<div class="evcard">'
    +'<div class="top"><span class="sid mono">'+esc(e.segment_id)+'</span><span>'+esc(e.meeting_title)+'</span><span>·</span><span>'+esc(e.speaker)+'</span><span>·</span><span>'+esc(e.timestamp||'无时间戳')+'</span></div>'
    +'<div class="quote">'+esc(e.quote)+'</div>'
    +'<div class="loc"><button class="linkbtn" onclick="showSource(\''+e.meeting_id+'\',\''+e.segment_id+'\')">定位回原文（含上下文）</button> <span class="mono" style="color:var(--muted)">'+esc(e.meeting_id)+' / 段落序号 '+e.order+'</span></div></div>').join('')||'<div class="hint">暂无证据</div>';
  document.getElementById('p-his').innerHTML='<div class="tl">'+h.map(r=>{
    const ch=(r.changes||[]).map(c=>'<div><span class="old">− '+esc(c.field)+': '+esc(JSON.stringify(c.old_value))+'</span> → <span class="new">+ '+esc(JSON.stringify(c.new_value))+'</span></div>').join('');
    return '<div class="tlitem"><div class="h"><span class="ver mono">v'+r.version+'</span> · '+CHGNAME[r.change_type]+' <span style="color:var(--muted);font-weight:400">· '+esc(r.meeting_id)+' '+esc(r.meeting_date)+'</span></div>'
      +'<div class="note">'+esc(r.note)+(r.raised_by?' · 触发人：'+esc(r.raised_by):'')+'</div>'
      +(ch?'<div class="diff">'+ch+'</div>':'')+'</div>';
  }).join('')+'</div>';
  let fl='';
  (m.conflicts||[]).forEach(c=>{
    fl+='<div class="alert conf"><div class="t">⚠ 字段冲突：'+esc(c.field)+'（系统不自动裁决）</div>';
    (c.candidates||[]).forEach(x=>fl+='<div style="margin:4px 0">· '+esc(JSON.stringify(x.value))+' <span class="mono" style="color:var(--muted)">← '+esc(x.meeting_id)+' / '+esc(x.evidence.segment_id)+'</span> <button class="linkbtn" onclick="showSource(\''+x.evidence.meeting_id+'\',\''+x.evidence.segment_id+'\')">查看</button></div>');
    fl+='</div>';
  });
  (m.missing_fields||[]).forEach(x=>fl+='<div class="alert miss"><div class="t">缺失字段：'+esc(x.field)+'</div><div>'+esc(x.reason)+'</div>'+(x.evidence?'<div class="mono" style="color:var(--muted);font-size:11px;margin-top:4px">'+esc(x.evidence.meeting_id)+' / '+esc(x.evidence.segment_id)+'</div>':'')+'</div>');
  if(!fl)fl='<div class="hint">该事项无冲突或缺失标注。</div>';
  document.getElementById('p-flag').innerHTML=fl;
  switchTab('info');
  document.getElementById('mask').classList.add('show');
  document.getElementById('drawer').classList.add('show');
}
function switchTab(t){
  document.querySelectorAll('.dtabs button').forEach(b=>b.classList.toggle('active',b.dataset.t===t));
  document.querySelectorAll('.dpanel').forEach(p=>p.classList.remove('active'));
  document.getElementById('p-'+t).classList.add('active');
}
function closeDrawer(){document.getElementById('mask').classList.remove('show');document.getElementById('drawer').classList.remove('show');}
function showSource(mid,sid){
  const mt=TRANSCRIPTS[mid];if(!mt){return;}
  const segs=mt.segments||[];const idx=segs.findIndex(s=>s.segment_id===sid);
  document.getElementById('srcTitle').textContent=mt.title+' · '+sid;
  let html='';
  const from=Math.max(0,idx-1),to=Math.min(segs.length-1,idx+1);
  for(let i=from;i<=to;i++){
    const s=segs[i];
    html+='<div class="seg'+(s.segment_id===sid?' target':'')+'"><div class="m"><span class="mono">'+esc(s.segment_id)+'</span><span>'+esc(s.speaker)+'</span><span>'+esc(s.timestamp||'')+'</span><span>'+(s.segment_id===sid?'← 证据段落':'上下文')+'</span></div><div class="txt">'+esc(s.text)+'</div></div>';
  }
  document.getElementById('srcBody').innerHTML=html;
  document.getElementById('srcModal').classList.add('show');
}
function closeSrc(){document.getElementById('srcModal').classList.remove('show');}

renderStats();renderBoard();renderQuality();
</script>
</body>
</html>
